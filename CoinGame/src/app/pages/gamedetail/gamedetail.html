<div class="min-h-screen bg-gradient-to-br from-[#1a1a2e] to-[#16213e] py-12 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Back Button -->
        <button (click)="goBack()"
            class="text-gray-300 hover:text-[#5cead6] mb-8 flex items-center gap-2 transition-all duration-300 hover:translate-x-1 group">
            <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <span class="font-medium">กลับไปหน้าร้านค้า</span>
        </button>

        <!-- Loading State -->
        <div *ngIf="isLoading" class="text-center py-20">
            <div class="inline-flex flex-col items-center">
                <div class="animate-spin rounded-full h-16 w-16 border-4 border-[#5cead6] border-t-transparent mb-4">
                </div>
                <p class="text-gray-400 text-lg">กำลังโหลดข้อมูลเกม...</p>
            </div>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !isLoading" class="text-center py-20">
            <div class="bg-[#2a2a4e] rounded-2xl p-8 max-w-md mx-auto border border-red-500/30">
                <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p class="text-red-400 text-xl mb-4">{{ error }}</p>
                <button (click)="loadGameDetail()"
                    class="px-6 py-3 bg-gradient-to-r from-[#5cead6] to-[#4ac4b0] text-black font-medium rounded-lg hover:opacity-90 transition-all duration-300 transform hover:scale-105">
                    ลองใหม่อีกครั้ง
                </button>
            </div>
        </div>

        <!-- Game Detail -->
        <div *ngIf="game && !isLoading" class="space-y-8">
            <!-- Top Section: Image + Info -->
            <div class="grid lg:grid-cols-2 gap-10">
                <!-- Left: Game Image -->
                <div class="relative group">
                    <div
                        class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl overflow-hidden h-[500px] shadow-2xl">
                        <img [src]="game.game_img" [alt]="game.game_name"
                            class="w-full h-full object-cover transition-all duration-500 group-hover:scale-105"
                            onerror="this.src='https://placehold.co/600x800/2a2a4e/5cead6?text=No+Image'">
                    </div>
                    <div
                        class="absolute top-4 right-4 bg-black/70 backdrop-blur-sm text-white px-3 py-1 rounded-full text-sm font-medium">
                        {{ game.name_type }}
                    </div>
                </div>

                <!-- Right: Game Info -->
                <div class="flex flex-col">
                    <div class="mb-6">
                        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 leading-tight">{{ game.game_name }}
                        </h1>

                        <div class="flex flex-wrap items-center gap-4 text-gray-300 mb-4">
                            <div class="flex items-center gap-2">
                                <svg class="w-5 h-5 text-[#5cead6]" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span class="font-medium">{{ game.release_date }}</span>
                            </div>

                            <div class="w-1 h-1 bg-gray-500 rounded-full"></div>

                            <div class="flex items-center gap-2">
                                <svg class="w-5 h-5 text-[#5cead6]" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                </svg>
                                <span class="font-medium">{{ game.name_type }}</span>
                            </div>
                        </div>
                    </div>

                    <div
                        class="mb-8 p-6 bg-gradient-to-r from-[#2a2a4e] to-[#1f1f3a] rounded-2xl border border-gray-700 shadow-lg">
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-gray-400 text-sm mb-1">ราคา</p>
                                <p class="text-[#5cead6] text-4xl font-bold">฿{{ game.price | number:'1.2-2' }}</p>
                            </div>


                        </div>
                    </div>

                    <button (click)="addToCart()"
                        class="w-full py-4 bg-gradient-to-r from-yellow-500 to-yellow-400 text-black font-bold rounded-xl hover:from-yellow-400 hover:to-yellow-300 transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-xl flex items-center justify-center gap-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        เพิ่มลงตะกร้า
                    </button>
                </div>
            </div>

            <!-- Bottom Section: Description (Full Width) -->
            <div class="bg-[#2a2a4e] rounded-2xl p-8 border border-gray-700 shadow-lg">
                <h2 class="text-2xl font-bold text-[#5cead6] mb-6 flex items-center gap-3">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    เกี่ยวกับเกมนี้
                </h2>
                <p class="text-gray-300 leading-relaxed text-lg text-justify"
                    style="text-indent: 2em; line-height: 1.8;">
                    {{ game.description }}
                </p>
            </div>
        </div>
    </div>
</div>
