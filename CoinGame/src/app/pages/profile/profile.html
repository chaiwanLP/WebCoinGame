<div class="min-h-screen bg-[#1a1a2e] py-12 px-4">
    <div class="max-w-7xl mx-auto">
        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Left Card: User Info -->
            <div class="lg:col-span-1">
                <div class="bg-[#2a2a4e] rounded-2xl p-8 border border-gray-700">
                    <!-- Profile Image -->
                    <div class="flex justify-center mb-6">
                        <div class="w-40 h-40 rounded-full overflow-hidden border-4 border-[#5cead6]">
                            <img [src]="currentUser?.profile_img" [alt]="currentUser?.username"
                                class="w-full h-full object-cover" >
                        </div>
                    </div>

                    <!-- User Info -->
                    <div class="text-center mb-6">
                        <p class="text-gray-400 text-sm mb-2">Username :</p>
                        <p class="text-white text-xl font-bold mb-4">{{ currentUser?.username }}</p>

                        <p class="text-gray-400 text-sm mb-2">Email :</p>
                        <p class="text-white text-lg mb-4">{{ currentUser?.email }}</p>

                        <p class="text-gray-400 text-sm mb-2">ยอดเงินปัจจุบัน</p>
                        <p class="text-white text-2xl font-bold">{{ currentUser?.wallet | number }} บาท</p>
                    </div>

                    <!-- Games Owned Count -->
                    <div class="bg-[#1e1e3a] rounded-xl p-4 mb-6">
                        <p class="text-[#5cead6] text-4xl font-bold text-center mb-1">{{ ownedGames.length }}</p>
                        <p class="text-gray-400 text-center text-sm">เกมที่เป็นเจ้าของ</p>
                    </div>

                    <!-- Edit Button -->
                    <button (click)="openEditModal()"
                        class="w-full py-3 bg-transparent border-2 border-[#5cead6] text-[#5cead6] rounded-xl font-semibold hover:bg-[#5cead6] hover:text-[#1e1e2f] transition-all duration-300">
                        แก้ไขโปรไฟล์
                    </button>
                </div>
            </div>

            <!-- Right Card: Owned Games -->
            <div class="lg:col-span-2">
                <div class="bg-[#2a2a4e] rounded-2xl p-8 border border-gray-700">
                    <h2 class="text-2xl font-bold text-white mb-6">เกมที่เป็นเจ้าของ</h2>

                    <!-- Games Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div *ngFor="let game of paginatedGames"
                            class="bg-[#1e1e3a] rounded-xl overflow-hidden hover:transform hover:-translate-y-1 transition-all duration-300 cursor-pointer">
                            <img [src]="game.img" [alt]="game.title" class="w-full h-32 object-cover">
                            <div class="p-3">
                                <p class="text-white text-sm font-semibold truncate">{{ game.title }}</p>
                                <p class="text-gray-400 text-xs">{{ game.category }}</p>
                            </div>
                        </div>

                        <!-- Empty slots -->
                        <div *ngFor="let i of [].constructor(gamesPerPage - paginatedGames.length)"
                            class="bg-[#1e1e3a] bg-opacity-30 rounded-xl h-48 border-2 border-dashed border-gray-700">
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="text-center text-white text-lg">
                        {{ currentPage }} >
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<div *ngIf="showEditModal" class="fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50"
    (click)="closeEditModal()">
    <div class="bg-gradient-to-br from-[#2a2a40] to-[#1e1e2f] rounded-2xl w-11/12 max-w-md p-10 shadow-2xl border border-[#5cead6] border-opacity-20 relative"
        (click)="$event.stopPropagation()">
        <button (click)="closeEditModal()"
            class="absolute top-4 right-4 text-gray-400 hover:text-red-400 text-4xl leading-none transition-colors duration-300">
            ×
        </button>

        <h2 class="text-3xl font-bold text-[#5cead6] mb-8 text-center">แก้ไขข้อมูล</h2>

        <form (ngSubmit)="saveProfile()" class="space-y-6">
            <!-- Profile Image Preview -->
            <div class="flex justify-center mb-6">
                <div class="relative">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-[#5cead6]">
                        <img [src]="editProfileImagePreview" alt="Profile" class="w-full h-full object-cover">
                    </div>
                    <label
                        class="absolute bottom-0 right-0 w-10 h-10 bg-[#5cead6] rounded-full flex items-center justify-center cursor-pointer hover:bg-[#4dd4c0] transition-colors duration-200">
                        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
                        <svg class="w-5 h-5 text-[#1e1e2f]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </label>
                </div>
            </div>

            <!-- Username -->
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">
                    ชื่อผู้ใช้
                </label>
                <input type="text" [(ngModel)]="editUsername" name="editUsername" required
                    class="w-full bg-[#1e1e2f] border border-gray-600 rounded-lg px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-[#5cead6] focus:ring-2 focus:ring-[#5cead6] focus:ring-opacity-20 transition-all duration-300">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">
                    อีเมล
                </label>
                <input type="email" [(ngModel)]="editEmail" name="editEmail" required
                    class="w-full bg-[#1e1e2f] border border-gray-600 rounded-lg px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-[#5cead6] focus:ring-2 focus:ring-[#5cead6] focus:ring-opacity-20 transition-all duration-300">
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 mt-8">
                <button type="button" (click)="closeEditModal()"
                    class="flex-1 border-2 border-gray-600 text-gray-300 px-6 py-3.5 rounded-lg font-semibold hover:bg-gray-700 hover:border-gray-500 transition-all duration-300">
                    ยกเลิก
                </button>
                <button type="submit"
                    class="flex-1 bg-[#5cead6] text-[#1e1e2f] px-6 py-3.5 rounded-lg font-semibold hover:bg-[#4dd4c0] hover:-translate-y-0.5 hover:shadow-lg hover:shadow-[#5cead6]/30 active:translate-y-0 transition-all duration-300">
                    บันทึก
                </button>
            </div>
        </form>
    </div>
</div>
