<div class="max-w-6xl mx-auto px-4 py-6">
  <!-- Search bar -->
  <div class="flex items-center gap-3 mb-6">
    <input
      type="text"
      placeholder="ค้นหาเกม...."
      [(ngModel)]="keyword"
      class="flex-1 px-4 py-2 rounded-md bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400"
    />

    <select
      [(ngModel)]="category"
      class="px-3 py-2 rounded-md bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-green-400"
    >
      <option value="">ประเภท</option>
      <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
    </select>

    <button
      class="px-4 py-2 rounded-md bg-green-400 text-black font-semibold hover:bg-green-500 transition"
    >
      ค้นหา
    </button>

    <!-- ตะกร้า -->
    <button class="ml-2 p-2 border border-yellow-400 text-yellow-400 rounded-md hover:bg-yellow-400 hover:text-black transition">
      🛒
    </button>
  </div>

  <!-- Title -->
  <h2 class="text-xl font-semibold text-white mt-6 mb-4">ร้านค้าเกม</h2>

  <!-- Game list -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <div
      *ngFor="let game of filteredGames"
      class="bg-gray-800 rounded-xl overflow-hidden shadow-md flex flex-col"
    >
      <img [src]="game.img" alt="{{game.title}}" class="w-full h-40 object-contain bg-gray-200" />

      <div class="p-4 flex flex-col flex-1">
        <h3 class="text-lg font-semibold text-green-300">{{ game.title }}</h3>
        <p class="text-gray-400">{{ game.category }}</p>
        <p class="text-green-400 font-semibold mt-2">{{ game.price | number:'1.2-2' }} บาท</p>

        <button
          class="mt-auto w-full py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition"
        >
          รายละเอียด
        </button>
      </div>
    </div>
  </div>
</div>
